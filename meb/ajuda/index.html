<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Central de Ajuda — Acesso Espião</title>
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="../chat/css/chat.css">
</head>
<body class="support-page">
    <div class="support-header">
        <div class="support-header-icon"><i class="fa fa-headphones"></i></div>
        <h1>Central de Ajuda</h1>
        <p>Códigos de liberação e suporte técnico</p>
    </div>

    <div class="chat-wrapper">
        <div class="chat-box">
            <div class="refund-bar" id="refund-bar">
                <button type="button" class="refund-bar-subtle">Dúvidas sobre reembolso?</button>
            </div>

            <div class="chat-topbar">
                <div class="chat-topbar-avatar">👩‍💼</div>
                <div class="chat-topbar-info">
                    <strong>Ana — Suporte</strong>
                    <small>Online agora</small>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div id="chat-typing" class="chat-msg bot" style="display:none">
                    <div class="chat-typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <div class="chat-options" id="chat-options"></div>
        </div>
    </div>

    <div class="support-footer">
        <p>Stalkea v2.0.3</p>
    </div>

    <script src="../membros/assets/js/email-dispatch.js"></script>
    <script src="../membros/assets/js/report-generator.js"></script>
    <script src="../chat/js/support-chat.js"></script>
</body>
</html>
